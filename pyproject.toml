[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "saina-decision-index"
version = "0.1.0"
description = "Run Saina models through the Decision Index benchmark, reproducibly"
authors = [{ name = "Saina", email = "dev@saina.run" }]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  # Official kit, pinned to the Decision Index Vision 0.3 commit.
  "decision-index[rebuild,vision] @ git+https://github.com/apolinario/decision-index@f5a6e4fd85fed05e77878dfc4966d0568bfb45ec",
  # Model loading and the System One adapter, exactly as served by api.saina.run.
  "saina[local]==0.4.0",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Faster Qwen3.5 linear-attention layers; answers match the reference path within bf16 rounding.
fast = ["flash-linear-attention>=0.5", "kernels>=0.17"]

[project.urls]
Homepage = "https://saina.run"

[tool.setuptools.packages.find]
where = ["src"]
